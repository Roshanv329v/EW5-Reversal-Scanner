# All tunable values live here. Paths are relative to this file's folder.

# ---- files -------------------------------------------------------------------
tickers_file: data/tickers.csv
stock_csv: data/stock.csv
backups_dir: data/backups
results_dir: results
logs_dir: logs
backups_keep: 3               # stock.csv is large once 60m bars are stored
dashboard_filters_file: data/dashboard_filters.json       # saved EW5 dashboard filters
dashboard_filters_file_ew3: data/dashboard_filters_ew3.json   # saved EW3 dashboard filters
stock_charts_filters_file: data/stock_charts_filters.json    # saved Charts tab filters

# ---- data download -----------------------------------------------------------
timeframes: ["1D", "4hr", "60m"]   # 4hr and 60m come from one 60m download
incremental_days: 30          # how much recent data to re-download on each update
full_history:
  "1D": "3y"                  # first download / new ticker
  "4hr": "730d"               # yfinance 60m limit is ~730 days
  "60m": "730d"
intraday_max_days: 729        # hard cap for any 60m request (yfinance limit)
timezone: Asia/Kolkata
batch_size: 50                # tickers per yf.download call
retries: 3
backoff_seconds: 2            # sleep = backoff_seconds * attempt number
auto_adjust: false            # false = split-adjusted only (like TradingView's default)
price_decimals: 2             # OHLC rounding when stored (removes float32 noise like 2309.1001)
short_history_bars: 500       # flag tickers with fewer bars than this
indicator_decimals: 4         # rounding of indicator columns


# ---- engine ------------------------------------------------------------------
min_bars: 120
engine:
  lengths: [4, 8, 16]
  horizon_bars: 30
  pivot_tie: strict
  stages: ["WAVE5_IN_PROGRESS"]
  min_w5_vs_w1: 0.0
  hi_source: high
  lo_source: low

# ---- EW3 (wave 2 finished / wave 3 starting) defaults --------------------------
ew3:
  stages: ["WAVE2_COMPLETED"]
  contexts: ["AFTER_WAVE5", "AFTER_ABC"]   # add "OTHER" for every 0-1-2 (about 10x more signals)
  min_retrace: 0.382          # wave 2 must retrace at least this much of wave 1
  max_retrace: 0.786          # ... and at most this much (must stay below 1.0)

# ---- higher-timeframe trend (trade in the direction of the bigger picture) -----
htf:
  weekly:
    name: "1W"                # weekly bars, built from the stored 1D bars (no download)
    source: "1D"
    week_ends: "SUN"          # a week runs Monday to Sunday; the bar is stamped with its Monday
  ladder:                     # signal timeframe -> [parent, grandparent]
    "60m": ["4hr", "1D"]
    "4hr": ["1D", "1W"]
    "1D": ["1W"]
    "1W": []
  trend_k: "dtosck"           # trend of the last finished higher-timeframe bar:
  trend_d: "dtoscd"           # bullish when DTosc K > D, bearish when K < D

# ---- dashboard chart ---------------------------------------------------------
chart:
  bars_before: 150            # bars shown before the signal
  timeframes: ["60m", "4hr", "1D"]   # chart timeframe switch (the signal's own timeframe is the default); add "1W" for weekly
  height: 680
  ema_fast: "13_ema"          # EMA columns drawn on the signal chart
  ema_slow: "55_ema"
  indicator_panes: ["rsi", "dtosc", "histogram"]   # series drawn together in the one indicator pane
  pane_height: 190            # height of the indicator pane
  overlay_height: 500         # price pane height inside the pop-up overlay
  overlay_pane_height: 160

# indicator values (at the signal bar) copied into every results file
signal_indicators: ["rsi", "dtosck", "dtoscd", "histogram", "13_ema", "21_ema", "55_ema", "atr14", "cci"]

# TradingView chart links in the alerts (Telegram)
tradingview:
  layout: ""                  # "" = a plain chart link (opens fine); or your saved layout's id from its URL
  intervals: {"60m": "60", "4hr": "240", "1D": "1D", "1W": "1W"}
  # Yahoo tickers that are not plain NSE stocks (NSE stocks: RELIANCE.NS -> NSE:RELIANCE, M&M.NS -> NSE:M_M)
  symbols:
    "^NSEI": "NSE:NIFTY"
    "^NSEBANK": "NSE:BANKNIFTY"
    "^CNXAUTO": "NSE:CNXAUTO"
    "^CNXPSE": "NSE:CNXPSE"
    "^CNXFMCG": "NSE:CNXFMCG"
    "^CNXIT": "NSE:CNXIT"
    "^CNXPHARMA": "NSE:CNXPHARMA"
    "^CNXPSUBANK": "NSE:CNXPSUBANK"
    "^CNXENERGY": "NSE:CNXENERGY"
    "^INDIAVIX": "NSE:INDIAVIX"
    "NIFTY_FIN_SERVICE.NS": "NSE:CNXFINANCE"
    "^BSESN": "BSE:SENSEX"
    "NG=F": "NYMEX:NG1!"
    "CL=F": "NYMEX:CL1!"
    "GC=F": "COMEX:GC1!"
    "SI=F": "COMEX:SI1!"

# Charts tab: every stock on 60m / 4hr / 1D / 1W with all EW5 / EW3 signals
stock_charts:
  trend_frames: ["1D", "1W"]  # trend side: LONG when DTosc K > D on all of these, SHORT when K < D on all
  timeframes: ["60m", "4hr", "1D", "1W"]
  default_timeframe: "1D"
  bars: {"60m": 350, "4hr": 300, "1D": 250, "1W": 156}   # bars shown (the slider goes up to all of them)
  phone_bars: {"60m": 700, "4hr": 600, "1D": 500, "1W": 260}   # bars sent to the phone chart (pinch to see them)
  list_rows: 300              # stocks shown in the list (best first)

# F&O 5-day eligibility (core/eligibility.py): EW5 / EW3 signals worth an F&O trade of at most
# 5 trading days. Trade: entry, STOP, first target (EW5 W4_END, EW3 W1_END), else exit at the
# close of day 5. Measured on every triggered signal of 11 May - 11 Nov 2026 (60m bars); only
# rules that gained in both halves of the period are used. R = result in multiples of the risk.
# Every other signal averaged about 0R (EW5 +0.02R, EW3 -0.11R) on such a trade.
fno_5day:
  fno_only: true              # only stocks with fno_enabled = true in tickers.csv
  max_days: 5
  ew5:
    A:
      degree: ["major"]
      max_stop_pct: 2.0
      not_alignment: ["AGAINST"]
      why: "major wave 5, stop ≤ 2%, not against the higher timeframes"
      backtest: "63 trades, avg +0.61R, 52% won (+0.82R / +0.40R in the two halves)"
    B:
      degree: ["major"]
      max_stop_pct: 3.0
      why: "major wave 5, stop ≤ 3%"
      backtest: "105 trades, avg +0.37R, 52% won (+0.55R / +0.25R)"
  ew3:
    A:
      not_alignment: ["AGAINST"]
      min_rr: 2.0
      max_stop_pct: 3.0
      max_ema55_gap_pct: 3.0
      why: "wave-1 target ≥ 2× the risk, stop ≤ 3%, price within 3% of the 55 EMA, not against the higher timeframes"
      backtest: "66 trades, avg +0.28R, 35% won but winners ≥ 2R (+0.34R / +0.22R)"

# Android: use several cores (an 8-core phone with 8 GB)
phone:
  update_parallel_parts: 4    # data update: parts updated at the same time (downloads overlap the indicator work)
  engine_workers: 4           # EW5 / EW3 runs: separate worker processes, each with its own Python (≈250 MB each);
                              # 0 or 1 = one part after the other in the app's own process
